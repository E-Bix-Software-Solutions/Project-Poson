<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1b3d" />
      <stop offset="60%" stop-color="#060d1f" />
      <stop offset="100%" stop-color="#030611" />
    </radialGradient>
    
    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3" />
      <stop offset="30%" stop-color="#f5c26b" />
      <stop offset="70%" stop-color="#d49c3f" />
      <stop offset="100%" stop-color="#a3721c" />
    </linearGradient>

    <!-- Soft Golden Aura Gradient -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c26b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f5c26b" stop-opacity="0" />
    </radialGradient>

    <!-- Pink Lotus Petals Gradient -->
    <linearGradient id="lotusGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d4849a" />
      <stop offset="100%" stop-color="#fce2e8" />
    </linearGradient>

    <!-- Soft Glow Filter to make things shine -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with a sleek golden border -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="10" />

  <!-- Thin inner decorative dashed ring representing cosmic order -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#f5c26b" stroke-width="2.5" stroke-dasharray="6, 8" opacity="0.45" />

  <!-- Rays of light emitting from the center -->
  <g opacity="0.18">
    <line x1="256" y1="36" x2="256" y2="476" stroke="#f5c26b" stroke-width="3" />
    <line x1="36" y1="256" x2="476" y2="256" stroke="#f5c26b" stroke-width="3" />
    <line x1="100" y1="100" x2="412" y2="412" stroke="#f5c26b" stroke-width="2" />
    <line x1="100" y1="412" x2="412" y2="100" stroke="#f5c26b" stroke-width="2" />
    <circle cx="256" cy="256" r="170" fill="none" stroke="#f5c26b" stroke-width="1.5" />
    <circle cx="256" cy="256" r="140" fill="none" stroke="#f5c26b" stroke-width="1.5" />
  </g>

  <!-- Aura Glow behind the Wheel -->
  <circle cx="256" cy="256" r="150" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- DHARMA CHAKRA (Wheel of Dhamma - 8 spokes) -->
  <g filter="url(#glow)" id="dharmachakra" transform="translate(0, -20)">
    <!-- Wheel Outer Rims -->
    <circle cx="256" cy="256" r="105" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
    <circle cx="256" cy="256" r="115" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="256" cy="256" r="92" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Central Hub -->
    <circle cx="256" cy="256" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="256" cy="256" r="10" fill="url(#goldGrad)" />
    
    <!-- 8 Spokes -->
    <!-- Spoke 1 (Up) -->
    <path d="M 256 151 L 256 234" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Spoke 2 (Down) -->
    <path d="M 256 278 L 256 361" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Spoke 3 (Left) -->
    <path d="M 151 256 L 234 256" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Spoke 4 (Right) -->
    <path d="M 278 256 L 361 256" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Spoke 5 (Up-Left) -->
    <path d="M 182 182 L 240 240" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Spoke 6 (Down-Right) -->
    <path d="M 272 272 L 330 330" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Spoke 7 (Up-Right) -->
    <path d="M 330 182 L 272 240" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Spoke 8 (Down-Left) -->
    <path d="M 240 272 L 182 330" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Distinct knobs on the outer rim (teeth of the wheel) -->
    <circle cx="256" cy="139" r="6" fill="url(#goldGrad)" />
    <circle cx="256" cy="373" r="6" fill="url(#goldGrad)" />
    <circle cx="139" cy="256" r="6" fill="url(#goldGrad)" />
    <circle cx="373" cy="256" r="6" fill="url(#goldGrad)" />
    <circle cx="173" cy="173" r="6" fill="url(#goldGrad)" />
    <circle cx="339" cy="339" r="6" fill="url(#goldGrad)" />
    <circle cx="339" cy="173" r="6" fill="url(#goldGrad)" />
    <circle cx="173" cy="339" r="6" fill="url(#goldGrad)" />
  </g>

  <!-- Sacred Pink Lotus Flower at the base -->
  <g id="lotus" transform="translate(0, 50)">
    <!-- Back petals -->
    <path d="M 256 290 C 215 290, 180 325, 170 370 C 205 370, 238 350, 256 315 C 274 350, 307 370, 342 370 C 332 325, 297 290, 256 290 Z" fill="url(#lotusGrad)" opacity="0.85" />
    
    <!-- Outer Left petal -->
    <path d="M 256 325 C 205 315, 135 360, 125 415 C 170 425, 215 390, 238 350 Z" fill="url(#lotusGrad)" />
    
    <!-- Outer Right petal -->
    <path d="M 256 325 C 307 315, 377 360, 387 415 C 342 425, 297 390, 274 350 Z" fill="url(#lotusGrad)" />
    
    <!-- Inner Central Petal -->
    <path d="M 256 300 C 232 335, 220 390, 256 425 C 292 390, 280 335, 256 300 Z" fill="url(#lotusGrad)" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Celestial Sparkles / Spiritual Stars -->
  <g fill="#ffe8a3" filter="url(#glow)">
    <!-- Top Left Star -->
    <path d="M 120 110 Q 120 120 130 120 Q 120 120 120 130 Q 120 120 110 120 Q 120 120 120 110 Z" opacity="0.9" />
    <!-- Top Right Star -->
    <path d="M 390 100 Q 390 110 400 110 Q 390 110 390 120 Q 390 110 380 110 Q 390 110 390 100 Z" opacity="0.9" />
    <!-- Mid Left Tiny Star -->
    <path d="M 75 260 Q 75 265 80 265 Q 75 265 75 270 Q 75 265 70 265 Q 75 265 75 260 Z" opacity="0.75" />
    <!-- Mid Right Tiny Star -->
    <path d="M 435 240 Q 435 245 440 245 Q 435 245 435 250 Q 435 245 430 245 Q 435 245 435 240 Z" opacity="0.75" />
  </g>
</svg>